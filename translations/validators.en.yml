akawaka_cms:
    page:
        code:
            unique: A page with this code already exists.
            regex: The code may only contain letters, digits, dashes and underscores.
        slug:
            unique: This slug is already used for this locale.
            regex: The slug may only contain lowercase letters, digits and dashes (and "/" for sub-paths).
        translation:
            at_least_one: Fill in at least one translation (title).
