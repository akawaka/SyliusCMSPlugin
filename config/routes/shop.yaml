akawaka_cms_shop_page_show:
    path: /{_locale}/pages/{slug}
    methods: [GET]
    controller: AKAWAKA\SyliusCMSPlugin\Controller\Shop\PageController
    requirements:
        _locale: '[a-z]{2,3}(?:_[A-Z]{2})?'
        slug: '.+'

akawaka_cms_shop_page_preview:
    path: /{_locale}/cms-preview/{token}
    methods: [GET]
    controller: AKAWAKA\SyliusCMSPlugin\Controller\Shop\PreviewController
    requirements:
        _locale: '[a-z]{2,3}(?:_[A-Z]{2})?'
        token: '[a-f0-9]{32}'
